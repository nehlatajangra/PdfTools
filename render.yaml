databases:
  - name: django-db
    databaseName: django_db
    user: django_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: django-app
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn project_name.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: django-app.onrender.com