name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Start scan
        uses: fjogeleit/http-request-action@v1
        with:
          url: "https://blacklock.io/api/scans/${{ secrets.SCAN_ID }}/start/"
          method: POST
          customHeaders: |
            {
              "Api-Key": "${{ secrets.API_KEY }}",
              "Content-Type": "application/json"
            }