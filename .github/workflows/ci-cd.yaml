name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  sbom-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Start SBOM Scan
        run: |
          curl --fail --location --request POST \
            -H "Api-Key: ${{ secrets.BLACKLOCK_API_KEY }}" \
            "https://azure-staging.blacklock.co.nz/api/sbom/${{ secrets.PROJECT_ID }}/start/"

      - name: Wait for Scan Completion
        run: |
          while true; do
            RESPONSE=$(curl -s \
              -H "Api-Key: ${{ secrets.BLACKLOCK_API_KEY }}" \
              "https://azure-staging.blacklock.co.nz/api/sbom/${{ secrets.PROJECT_ID }}/result/")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            if [ "$STATUS" = "completed" ]; then
              echo "SBOM scan completed."
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "SBOM scan failed."
              exit 1
            fi

            if [ "$STATUS" = "cancelled" ]; then
              echo "SBOM scan cancelled."
              exit 1
            fi

            echo "Waiting 30 seconds..."
            sleep 30
          done

      - name: Download Report
        run: |
          curl --fail --location \
            -H "Api-Key: ${{ secrets.BLACKLOCK_API_KEY }}" \
            -o sbom-report.json \
            "https://azure-staging.blacklock.co.nz/api/sbom/${{ secrets.PROJECT_ID }}/download/"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom-report.json

